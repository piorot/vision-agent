name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # http-ece (a pywebpush dependency) only builds with an older setuptools; see the Dockerfile.
      - run: |
          pip install "setuptools<80" wheel pytest httpx
          pip install --no-build-isolation http-ece
          pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
