# fly.toml app configuration file generated for vision-agent on 2026-10-17T20:55:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vision-agent'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'

[mounts]
  source = 'vision_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1  # keep one machine up: /events listeners live in its memory

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
