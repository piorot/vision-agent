<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Vibe</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 16px; }
  button, input { font-size: 1rem; padding: .6rem; width: 100%; margin: .4rem 0; box-sizing: border-box; }
  #out { font-size: 1.2rem; margin-top: 1rem; white-space: pre-wrap; }
  #latest { margin-top: 1.5rem; text-align: center; }
  #latest[hidden] { display: none; }
  #pic { max-width: 100%; max-height: 50vh; border-radius: 8px; }
  .big { font-size: 2.5rem; font-weight: 700; margin: .75rem 0 .25rem; overflow-wrap: anywhere; }
  .dots { font-size: 1.5rem; letter-spacing: .3rem; min-height: 1.5rem; }
  #awake { font-size: .85rem; color: #666; margin-top: 1rem; }
</style>
</head>
<body>
  <h1>Vision Vibe</h1>
  <input id="token" type="password" placeholder="Access token (if set)">
  <input id="file" type="file" accept="image/*" capture="environment">
  <button id="go">Ask</button>
  <button id="enable">Enable vibration alerts</button>
  <div id="out"></div>
  <div id="latest" hidden>
    <img id="pic" alt="Latest image">
    <div id="answers"></div>
  </div>
  <div id="awake"></div>
<script>
const out = document.getElementById("out");
const tokenInput = document.getElementById("token");
let lastId = null, source = null, pushActive = false;

function render({ answers, image_url }) {
  // The image is only served once an answer has been broadcast, so it is shown from the event, not the /ask response.
  const sep = image_url ? (image_url.includes("?") ? "&" : "?") : "";
  if (image_url) document.getElementById("pic").src = image_url + sep + "token=" + encodeURIComponent(tokenInput.value);
  const box = document.getElementById("answers");
  box.replaceChildren(...answers.map((a) => {
    const row = document.createElement("div");
    const big = Object.assign(document.createElement("div"), { className: "big", textContent: a.answer });
    const dots = Object.assign(document.createElement("div"), { className: "dots", textContent: "●".repeat(a.vibrations) || "—" });
    row.append(big, dots);
    return row;
  }));
  document.getElementById("latest").hidden = false;
}

const PAUSE_MS = 10000; // between answers when several questions are in one image
let buzzTimer = null;

function buzz(answers, i = 0) {
  navigator.vibrate(pulses(answers[i].vibrations));
  if (i + 1 < answers.length) {
    // The next answer starts PAUSE_MS after this one's buzz ends.
    buzzTimer = setTimeout(() => buzz(answers, i + 1), answers[i].vibrations * 500 + PAUSE_MS);
  }
}

function pulses(n) {
  const pattern = [];
  for (let i = 0; i < n; i++) pattern.push(300, 200); // 300ms on, 200ms off
  return pattern;
}

function show(a) {
  if (a.id === lastId) return; // the asking page also gets the broadcast; handle each answer once
  lastId = a.id;
  clearTimeout(buzzTimer); // a new image supersedes the remaining buzzes of the old one
  navigator.vibrate?.(0);
  render(a);
  if (a.replay) return; // a page that just opened shows the last answer without vibrating
  out.textContent = a.answers.map((x, i) => `${a.answers.length > 1 ? i + 1 + ". " : ""}Answer: ${x.answer} (${x.vibrations} vibrations)`).join("\n");
  if (pushActive) return; // the push notifications vibrate this device, including with the page closed
  if (!navigator.vibrate) { out.textContent += "\n(Vibration not supported on this device/browser)"; return; }
  buzz(a.answers);
}

function listen() {
  if (source) source.close();
  source = new EventSource("/events?token=" + encodeURIComponent(tokenInput.value)); // reconnects on its own
  source.onmessage = (e) => show(JSON.parse(e.data));
}

function keyBytes(b64url) {
  const b64 = (b64url + "=".repeat((4 - b64url.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
}

// Web Push is what lets a phone vibrate with this page closed or in the background.
async function enablePush(ask) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "unsupported";
  const kr = await fetch("/push/key?token=" + encodeURIComponent(tokenInput.value));
  if (!kr.ok) return "unavailable";
  const { key } = await kr.json();
  if (Notification.permission === "default" && ask) await Notification.requestPermission();
  if (Notification.permission !== "granted") return "denied";
  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  const want = keyBytes(key);
  let sub = await reg.pushManager.getSubscription();
  if (sub && String(new Uint8Array(sub.options.applicationServerKey)) !== String(want)) {
    await sub.unsubscribe(); // the server's VAPID key changed
    sub = null;
  }
  sub = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
  const r = await fetch("/push/subscribe", {
    method: "POST", body: JSON.stringify(sub),
    headers: { "Content-Type": "application/json", "X-Token": tokenInput.value },
  });
  return r.ok ? "ok" : "failed";
}

const PUSH_MESSAGES = {
  ok: "Alerts on: this device vibrates for every new image, even with the page closed.",
  unsupported: "This browser can't do background alerts. (iPhones can't vibrate from a web page at all.)",
  unavailable: "The server has no push keys set up, so vibration works only while this page is open.",
  denied: "Notifications are blocked for this site. Allow them in the browser's site settings.",
  failed: "Could not register this device for alerts.",
};

async function setupPush(ask) {
  try {
    const result = await enablePush(ask);
    pushActive = result === "ok";
    if (ask || pushActive) out.textContent = PUSH_MESSAGES[result] ?? result;
  } catch (e) { out.textContent = "Push setup failed: " + e.message; }
}

// Keep the screen on while this page is visible. The browser drops the lock when the tab is hidden, so take it again.
let wakeLock = null;
async function keepAwake() {
  const note = document.getElementById("awake");
  if (!("wakeLock" in navigator)) { note.textContent = "This browser can't keep the screen on; adjust the phone's screen timeout."; return; }
  if (document.visibilityState !== "visible" || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
    note.textContent = "Screen will stay on while this page is open.";
  } catch (e) { note.textContent = "Could not keep the screen on (battery saver?): " + e.message; }
}
document.addEventListener("visibilitychange", keepAwake);
keepAwake();

// A tap is required before browsers allow notifications or vibration; it also gives a test buzz.
document.getElementById("enable").onclick = () => {
  listen();
  keepAwake();
  if (navigator.vibrate) navigator.vibrate(200);
  setupPush(true);
};
if (window.Notification && Notification.permission === "granted") setupPush(false); // re-register after a deploy
listen();

document.getElementById("go").onclick = async () => {
  const f = document.getElementById("file").files[0];
  if (!f) { out.textContent = "Pick an image first."; return; }
  out.textContent = "Thinking…";
  const fd = new FormData();
  fd.append("image", f);
  try {
    const r = await fetch("/ask", {
      method: "POST", body: fd,
      headers: { "X-Token": tokenInput.value },
    });
    if (!r.ok) throw new Error(r.status + " " + (await r.text()));
    const a = await r.json();
    show({ ...a, image_url: `/latest-image?id=${a.id}` }); // same shape as the broadcast event
  } catch (e) { out.textContent = "Error: " + e.message; }
};
</script>
</body>
</html>
